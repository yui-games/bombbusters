<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="online.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBオンライン">
<link rel="apple-touch-icon" href="icon-180.png">
<title>爆弾解除 オンライン対戦</title>
<style>
:root{--bg:#fbe9c8;--panel:#ffffff;--panel2:#fff2d6;--line:#ecd0a2;--gold:#e89b16;--red:#ff5d62;--blue:#3f9bff;--green:#2fbf6a;--text:#4d3f1f;--mut:#a98f60;--wire:#5fb8d0;--ink:#2c2310;--dark:#222c52;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:#fbe9c8;color:var(--text);font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;}
body{padding:10px 12px 20px;max-width:900px;margin:0 auto;background:linear-gradient(#fdf1d8,#f6dfb6);}
h1{font-size:18px;margin:2px 0;}
.sub{color:var(--mut);font-size:12px;margin-bottom:12px;line-height:1.5;}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:9px 11px;margin-bottom:9px;box-shadow:0 3px 0 #ecce97,0 7px 16px rgba(150,100,30,.10);}
.card h2{font-size:13px;margin:0 0 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink);}
.tag{display:inline-block;font-size:11px;background:var(--gold);border:2px solid #c9820f;color:#fff;border-radius:20px;padding:2px 11px;font-weight:800;}
.tag.b{background:var(--blue);border-color:#2c7fe0;color:#fff;}.tag.g{background:var(--green);border-color:#23a058;color:#fff;}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 4px;}
input,select{width:100%;background:#fffdf7;border:2px solid var(--line);color:var(--text);border-radius:12px;padding:11px;font-size:16px;font-family:inherit;}
.row{display:flex;gap:10px;flex-wrap:wrap;}.row>div{flex:1;min-width:120px;}
button{font-family:inherit;font-size:15px;border:none;border-radius:14px;padding:11px 13px;font-weight:800;color:#fff;background:var(--gold);box-shadow:0 3px 0 #c9820f;}
button.sec{background:#fff2d6;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 #ecce97;}
button.ghost{background:#ffffff;color:var(--mut);border:2px solid var(--line);font-weight:600;box-shadow:none;}
button.blue{background:var(--blue);color:#fff;box-shadow:0 3px 0 #2c7fe0;}button.danger{background:#fff0f0;color:var(--red);border:2px solid var(--red);box-shadow:0 3px 0 #f4b9bb;}
button:active{transform:translateY(2px);box-shadow:none;}button:disabled{opacity:.45;box-shadow:none;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}.btnrow button{flex:1;min-width:84px;}
.num{display:flex;gap:6px;flex-wrap:wrap;}.num button{min-width:46px;flex:0 0 auto;}
.kpis{display:flex;gap:10px;text-align:center;}.kpis>div{flex:1;background:#fff7e3;border:2px solid var(--line);border-radius:14px;padding:8px;}
.kpis .v{font-size:20px;font-weight:800;color:#e89b16;}.kpis .l{font-size:10px;color:var(--mut);}
.lives{font-size:18px;letter-spacing:2px;}
.boardlives{margin-left:auto;display:flex;align-items:center;gap:6px;}
.boardlives .bll{font-size:11px;color:var(--mut);}
.boardcard .lives{font-size:22px;}
.seat{background:#fff7e3;border:2px solid var(--line);border-radius:14px;padding:6px 8px;margin-bottom:6px;}
.seat.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;}
.seat.you{background:#fff6dd;border-color:var(--gold);}
.seat.you.active{box-shadow:0 0 0 2px var(--gold) inset;}
.capmark{display:inline-block;background:var(--gold);color:#fff;border:1px solid #c9820f;border-radius:6px;font-size:10px;font-weight:900;padding:1px 6px;}
.seat .nm{font-weight:800;font-size:14px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;color:var(--ink);}
.seat .nmL{display:flex;align-items:center;gap:7px;}
.tiles{display:flex;flex-wrap:wrap;column-gap:5px;row-gap:26px;padding-top:14px;padding-bottom:16px;}
.lt{position:absolute;left:0;right:0;bottom:-14px;text-align:center;font-size:10px;font-weight:800;color:var(--mut);z-index:2;line-height:1;}
/* --- wire tile (dark rail, friendly rounding) --- */
.tile{position:relative;width:40px;height:56px;border-radius:9px;background:linear-gradient(#52a8ff,#2f86e6);border:2px solid #2470cf;box-shadow:0 2px 4px rgba(30,70,130,.30),inset 0 0 0 1px rgba(255,255,255,.20);display:flex;align-items:center;justify-content:center;color:#fff;}
.tile .big{font-size:21px;font-weight:800;z-index:2;text-shadow:0 1px 2px #000;}
.tile small{position:absolute;bottom:3px;font-size:14px;color:#fff;z-index:2;font-weight:800;text-shadow:0 1px 2px #000;line-height:1;}
.tile.y .big{color:#fff;}.tile.y .big,.tile.r .big{font-size:17px;}
.tile.y{background:linear-gradient(#ffc733,#f2a200);border-color:#dca200;}
.tile.y .ysq{position:absolute;top:7px;width:15px;height:15px;border-radius:3px;background:#6b4700;z-index:2;}
.tile.r{background:linear-gradient(#ff6f73,#e2484d);border-color:#c92d33;}
.tile.r .bomb{position:absolute;top:7px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#5a1418,#2c0809);box-shadow:0 0 0 1px rgba(0,0,0,.15);z-index:2;}
.tile.cut{opacity:.26;filter:grayscale(.4);}
.tile.back{background:repeating-linear-gradient(45deg,#caa163,#caa163 4px,#b88c4d 4px,#b88c4d 8px);color:transparent;border-color:#9c7338;}
.tile.sel{outline:3px solid var(--gold);outline-offset:-3px;}
/* info token */
.xmk{position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:9;font-size:13px;font-weight:900;color:#fff;background:#222;border:1px solid #000;border-radius:5px;width:16px;height:16px;line-height:14px;text-align:center;}
.tile.xc{outline:2px solid #222;outline-offset:-2px;}
.tk{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:#ffffff;color:#2a2212;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;box-shadow:0 2px 3px rgba(80,50,10,.4);z-index:6;white-space:nowrap;border:1px solid #e7c98c;}
.tk::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#ffffff;}
.tk.yel{background:#ffce3a;width:15px;height:15px;padding:0;border-radius:4px;border-color:#e0a51a;}
.tk.yel::after{border-top-color:#ffce3a;}
.declare{background:#fff7e3;border:2px solid var(--blue);border-radius:14px;padding:11px;font-size:14px;line-height:1.55;margin-bottom:8px;color:var(--ink);}
.declare b{color:#c9820f;}
.sect{border-top:2px dashed var(--line);margin-top:10px;padding-top:8px;}.sect .t{font-size:12px;color:#e8901a;font-weight:800;margin-bottom:4px;}
.muted{color:var(--mut);font-size:12px;line-height:1.5;}.note{font-size:11px;color:var(--mut);margin-top:5px;line-height:1.45;}
.log{font-size:13px;max-height:185px;overflow:auto;line-height:1.7;background:#fbf3df;border-radius:12px;padding:7px 10px;color:var(--text);}
.log div{padding:2px 0;border-bottom:1px solid #ecd9b3;}
.log .me{color:#c9820f;}.log .bad{color:#d6453f;}.log .ok{color:#1f9b54;}
.hidden{display:none;}
.banner{padding:14px;border-radius:16px;text-align:center;font-weight:800;font-size:18px;margin-bottom:12px;}
.banner.win{background:#dcfbe7;border:2px solid var(--green);color:#1f9b54;}
.banner.lose{background:#ffe2e3;border:2px solid var(--red);color:#e0474c;}
.turnbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.pill{font-size:12px;padding:4px 10px;border-radius:20px;border:2px solid var(--line);background:#fff7e3;color:var(--mut);font-weight:700;}
.pill.on{background:var(--gold);border-color:#c9820f;color:#fff;font-weight:800;}
.legend{font-size:11px;color:var(--mut);margin-top:4px;}.legend span{display:inline-block;margin-right:10px;}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px;}
.track{display:flex;overflow-x:auto;gap:1px;padding-bottom:3px;align-items:stretch;}
.tnum{min-width:46px;background:#fffaf0;border:2px solid var(--line);border-radius:10px;padding:5px 2px;text-align:center;flex:0 0 auto;color:var(--ink);}
.tnum.done{opacity:.34;}.tnum .n{font-size:20px;font-weight:800;}.tnum .d{font-size:10px;color:var(--mut);margin-top:2px;}.tnum .d b{font-size:23px;color:var(--green);font-weight:800;}
.tgap{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;min-width:25px;flex:0 0 auto;}
.tgap.empty{min-width:6px;}
.tnum.locked{box-shadow:0 0 0 2px var(--red) inset;}
.prio{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:8px;}
.prio .plabel{font-size:11px;font-weight:800;color:var(--mut);}
.pchip{font-size:13px;font-weight:800;border-radius:10px;padding:3px 9px;border:2px solid var(--line);background:#fff7e3;color:var(--ink);}
.pchip.cur{background:var(--gold);color:#fff;border-color:#c9820f;}
.pchip.done{opacity:.5;}
.pchip.lock{color:var(--red);border-color:var(--red);background:#fff0f0;}
.parrow{color:var(--mut);font-weight:800;}
.mk.r{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#ff9a9a,#e23b41);}
.mk.y{width:17px;height:7px;border-radius:2px;background:#ffce3a;}
.mk.off{opacity:.2;}.mkspace{height:13px;}
.mk.rq{width:23px;height:23px;border-radius:6px;border:2px solid #e0474c;color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;background:var(--red);}
.mk.yq{width:24px;height:19px;border-radius:6px;border:2px solid #e0a51a;color:#6b4700;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;background:#ffce3a;}
.detstat{display:flex;justify-content:flex-end;margin-top:6px;}
.detchip{font-size:10px;font-weight:700;padding:1px 8px;border-radius:10px;border:2px solid var(--line);background:#fff7e3;}
.detchip.avail{color:#1f9b54;border-color:var(--green);}
.detchip.used{color:var(--mut);opacity:.6;}
.rel{align-self:center;font-size:18px;font-weight:900;padding:0 1px;line-height:1;}
.rel.eq{color:#cf8a00;}
.rel.ne{color:var(--red);}

/* ===== landscape dashboard layout ===== */
.boardgrid{display:flex;flex-direction:column;}
.boardequip .subh{margin-top:10px;}
.myhandwrap{margin-top:8px;background:#fff6dd;border:2px solid var(--gold);border-radius:14px;padding:7px 9px;box-shadow:0 2px 0 #ecce97;}
.myhandlabel{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:7px;}
#actionbar{margin-top:8px;}#actionbar .btnrow button{min-width:96px;padding:12px;}
.handsbox .turnbar{margin-top:8px;}
.sidetitle{display:none;}
@media (orientation:landscape) and (min-width:840px){
  body{max-width:1340px;padding-left:54px;padding-right:54px;}
  .boardgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);grid-template-areas:"hands be" "hands log" "hands ctrl";gap:12px;align-items:start;}
  .boardgrid>.card{margin-bottom:0;}
  .handsbox{grid-area:hands;align-self:stretch;}
  .boardequip{grid-area:be;}.logcard{grid-area:log;}.ctrlcard{grid-area:ctrl;}
  .sidetitle{display:block;position:fixed;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font-family:"Arial Black",Arial,Helvetica,sans-serif;font-weight:900;font-size:42px;line-height:1;letter-spacing:3px;color:var(--red);opacity:.95;pointer-events:none;z-index:5;text-shadow:2px 2px 0 #fff,3px 3px 0 rgba(160,95,20,.22);white-space:nowrap;}
  .sidetitle.left{left:6px;}.sidetitle.right{right:6px;}
}
/* === PC（広い画面）だけボード列を広げる。iPad(<=1366px)は据え置き === */
@media (orientation:landscape) and (min-width:1400px){
  body{max-width:1700px;}
  .boardgrid{grid-template-columns:minmax(0,1fr) 760px;}
}
/* 配信用：縦長（タブレット）表示への手動切替 */
body.disp-tab{max-width:820px!important;padding-left:14px!important;padding-right:14px!important;}
body.disp-tab .boardgrid{display:flex!important;flex-direction:column!important;}
body.disp-tab .sidetitle{display:none!important;}
/* ===== トースト通知 ===== */
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;pointer-events:none;width:min(92vw,430px);}
.toastmsg{background:rgba(35,30,20,.93);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;transform:translateY(-6px);transition:.25s;white-space:pre-line;text-align:center;}
.toastmsg.show{opacity:1;transform:none;}
/* プレイヤー名: どちらの配色でも読めるよう濃色固定＋薄いチップ */
.nm{color:#241a06;}
.nmL{background:rgba(36,26,6,.08);padding:2px 10px 2px 6px;border-radius:12px;font-size:15px;}
body.skin-pop .nm{color:#241a06;}
body.skin-pop .nmL{background:rgba(36,26,6,.14);}
/* ===== 配信ポップスキン（オーバーレイ画像と同系統: チャコール×ハザード黄×赤青） ===== */
body.skin-pop{
  --panel:#1d2027;--panel2:#262a34;--line:#3a3f4d;--gold:#FFD23F;
  --text:#e8e9ef;--mut:#9aa0b2;--ink:#f3f4f8;
  background:repeating-linear-gradient(135deg,#15171e 0 23px,#1a1d26 23px 46px);
}
body.skin-pop .card{box-shadow:0 3px 0 #0a0b0f,0 7px 16px rgba(0,0,0,.4);}
body.skin-pop button{color:#1a1c22;box-shadow:0 3px 0 #b98e12;}
body.skin-pop button.blue{color:#fff;}
body.skin-pop button.sec{background:#262a34;color:var(--text);box-shadow:0 3px 0 #0a0b0f;}
body.skin-pop button.ghost{background:#1d2027;color:var(--mut);}
body.skin-pop button.danger{background:#2a1518;box-shadow:0 3px 0 #571f24;}
body.skin-pop .tag{color:#1a1c22;border-color:#c9970f;}
body.skin-pop .pill{background:#262a34;}
body.skin-pop .pill.on{color:#1a1c22;}
body.skin-pop .tnum{background:#262a34;}
body.skin-pop .log{background:#14161c;}
body.skin-pop .log div{border-bottom-color:#2a2e3a;}
body.skin-pop .log .me{color:#FFD23F;}
body.skin-pop .myhandwrap{background:#23262f;box-shadow:0 2px 0 #0a0b0f;}
body.skin-pop .declare{background:#1d2027;}
body.skin-pop .banner.win{background:#11331f;color:#7ce3a4;}
body.skin-pop .banner.lose{background:#3a1418;color:#ff8a8e;}
body.skin-pop input,body.skin-pop select{background:#262a34;color:var(--text);border-color:var(--line);}
body.skin-pop .prow{background:#262a34;}
/* ===== 配信用演出 ===== */
.fx-flash{position:fixed;inset:0;z-index:600;pointer-events:none;animation:fxfade .5s forwards;}
@keyframes fxfade{from{opacity:1}to{opacity:0}}
.fx-p{position:fixed;z-index:610;pointer-events:none;}
@keyframes fxfall{from{transform:translateY(0) rotate(0)}to{transform:translateY(115vh) rotate(380deg)}}
@keyframes fxrise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-45vh) scale(1.7);opacity:0}}
.fx-shake{animation:fxsh .35s;}
.fx-shake-big{animation:fxshb .65s;}
@keyframes fxsh{0%,100%{transform:translate(0)}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,2px)}}
@keyframes fxshb{0%,100%{transform:translate(0)}10%{transform:translate(-12px,6px)}25%{transform:translate(10px,-8px)}40%{transform:translate(-9px,-5px)}55%{transform:translate(8px,6px)}70%{transform:translate(-6px,3px)}85%{transform:translate(4px,-3px)}}
.connbar{position:fixed;top:0;left:0;right:0;background:#b91c1c;color:#fff;text-align:center;font-weight:800;padding:6px;z-index:400;font-size:13px;}

/* ===== 作戦室スキン（既定・2026-09-22 デザイン刷新）。ロゴ・背景・タイル画像は assets/ ===== */
body.skin-ops{--bg:#0b1020;--panel:#151c33;--panel2:#1b2340;--line:#2e3a5e;--gold:#ffc93c;--red:#ff4b5c;--blue:#4c8dff;--green:#3ddc84;--text:#e8edf5;--mut:#93a3bd;--ink:#ffffff;--dark:#0b1020;
  background:#0b1020;color:var(--text);}
html:has(body.skin-ops){background:#0b1020;}
body.skin-ops::before{content:'';position:fixed;inset:0;z-index:-1;background:#0b1020 url('assets/bg.jpg') center top/cover no-repeat;}
body.skin-ops #navbar{background:rgba(11,16,32,.86)!important;border-bottom-color:#2e3a5e!important;backdrop-filter:blur(4px);}
body.skin-ops #navbar a{color:#e8edf5!important;background:rgba(255,255,255,.08)!important;border-color:#2e3a5e!important;}
.ops-logo{display:none;}
body.skin-ops .ops-logo{display:block;width:min(72vw,440px);margin:6px auto 2px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.65));}
body.skin-ops .ops-logo.small{width:min(46vw,260px);margin:2px auto 8px;}
body.skin-ops .sidetitle{color:rgba(255,201,60,.32);text-shadow:0 0 18px rgba(255,201,60,.25);}
body.skin-ops h1{color:#fff;}
body.skin-ops .card{background:rgba(21,28,51,.90);border:2px solid #2e3a5e;box-shadow:0 3px 0 #070b16,0 10px 26px rgba(0,0,0,.5);}
body.skin-ops .card h2{color:#fff;}
body.skin-ops .tag{background:var(--gold);color:#1a1400;border-color:#d9a520;}
body.skin-ops .tag.b{background:var(--blue);color:#fff;border-color:#2f6fd8;}body.skin-ops .tag.g{background:var(--green);color:#062a15;border-color:#22b86a;}
body.skin-ops label{color:var(--mut);}
body.skin-ops input,body.skin-ops select{background:#0f1529;color:#fff;border-color:#2e3a5e;}
body.skin-ops input::placeholder{color:#6f7e9a;}
body.skin-ops button{color:#1a1400;background:linear-gradient(#ffd45c,#f5b400);box-shadow:0 3px 0 #a87a00;}
body.skin-ops button.sec{background:#1f2845;color:#fff;border:2px solid #2e3a5e;box-shadow:0 3px 0 #070b16;}
body.skin-ops button.ghost{background:#121a30;color:var(--mut);border:2px solid #2e3a5e;box-shadow:none;}
body.skin-ops button.blue{background:linear-gradient(#5d9bff,#3a7ae6);color:#fff;box-shadow:0 3px 0 #245bb8;}
body.skin-ops button.danger{background:#2a1518;color:#ff8a8e;border:2px solid #ff4b5c;box-shadow:0 3px 0 #571f24;}
body.skin-ops .kpis>div{background:#0f1529;border-color:#2e3a5e;}body.skin-ops .kpis .v{color:var(--gold);}
body.skin-ops .seat{background:#111a33;border-color:#2e3a5e;}
body.skin-ops .seat.you{background:#172448;border-color:var(--gold);}
body.skin-ops .seat.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 0 16px rgba(255,201,60,.35);}
body.skin-ops .capmark{color:#1a1400;}
body.skin-ops .nm{color:#fff;}body.skin-ops .nmL{background:rgba(255,255,255,.08);}
body.skin-ops .lt{color:#93a3bd;}
/* コード（タイル）＝画像。数字はCSSで上に描く */
body.skin-ops .tile{border:0;background:url('assets/tile_blue.png') center/100% 100% no-repeat;box-shadow:0 3px 8px rgba(0,0,0,.55);}
body.skin-ops .tile.y{background-image:url('assets/tile_yellow.png');}
body.skin-ops .tile.r{background-image:url('assets/tile_red.png');}
body.skin-ops .tile.back{background:url('assets/tile_back.png') center/100% 100% no-repeat;border:0;}
body.skin-ops .tile .big{font-size:22px;text-shadow:0 1px 0 rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.6);}
body.skin-ops .tile.y .big,body.skin-ops .tile.r .big{font-size:18px;}
body.skin-ops .tile.y .ysq,body.skin-ops .tile.r .bomb{display:none;}
body.skin-ops .tile.cut{opacity:.28;filter:grayscale(.6);}
body.skin-ops .tile.sel{outline:3px solid var(--gold);outline-offset:-3px;box-shadow:0 0 0 3px rgba(255,201,60,.35),0 3px 8px rgba(0,0,0,.55);}
body.skin-ops .tk{background:#fff;color:#1a1400;border-color:#d9c37a;}

body.skin-ops .sect{border-top-color:#2e3a5e;}body.skin-ops .sect .t{color:var(--gold);}

<script src="qr.js"></script>
<script>
/* サーバーURLは既定値を持たせる。毎回入力・記憶しなくてよいように。 */
var SRV_DEFAULT='https://bombbusters-server.ryo5exeg.workers.dev';
var SRV='', PID='', CODE='', MYSEAT=-1, ROOM=null, VIEW=null, poll=null, REV=0, failCount=0;
var selTarget=null, selOwn=null, detMode=false, detSel=[];
var EQHELP={
 kotonal:['コトナルラベル','自分の隣り合う2本に「≠（数字が違う）」の目印を付ける。コードが公開・非公開どちらでも使える。<b>自分の手番でなくても使える。</b>'],
 swap:['イレカエシーバー','自分が選んだ1本と、仲間が選んだ1本を交換する。交換する相手は装備の使用を宣言したプレイヤーが選ぶ。<b>自分の手番でなくても使える。</b>'],
 mitsu:['ミッツケル探知機','数字を1つ宣言。対象の仲間の3本の中にその数字があれば1本切断。外れると残機-1。使うと手番は次の人へ。'],
 reveal:['ヒント付箋','自分の青コードを1本選んで情報トークンを置く。仲間へのヒントにする。<b>自分の手番でなくても使える。</b>'],
 super:['スーパー探知機','自分が持つ数字を1つ宣言。対象の仲間の手札全体にその数字があれば1枚切断。フツーノ探知機の上位版。使うと手番は次へ。'],
 life:['失敗帳消し機','残機を1つ回復する（＋1）。<b>自分の手番でなくても使える。</b>'],
 battery:['非常電池','探知機を使い切った仲間（最大2人）を選び、その探知機をもう一度使えるようにする。<b>自分の手番でなくても使える。</b>'],
 radar:['なんでもレーダー','数字を1つ宣言すると、その数字を伏せて持っているのが誰かが分かる。<b>自分の手番でなくても使える。</b>'],
 ice:['万能氷','この手番の失敗を無効化。次の宣言が赤でも爆発せず、外しても残機が減らない。<b>自分の手番の開始時（行動の前）に使う。</b>'],
 dochi:['ドッチカアタ・レイ','数字を2つ宣言。対象の仲間の1本がそのどちらかなら切断。外れると残機-1。使うと手番は次へ。'],
 extra:['いつでもコーヒー','自分以外の好きなプレイヤーを1人選び、その人から手番を再開する。'],
 equal:['イコールラベル','自分の隣り合う2本に「＝（数字が同じ）」の目印を付ける。コードが公開・非公開どちらでも使える。<b>自分の手番でなくても使える。</b>'],
 himitsu:['ヒミツ底','#9以降のミッションで登場。黄コードを切断すると使えるようになり、装備カードを2枚ランダムに追加する。<b>黄コード切断後はいつでも（自分の手番でなくても）使える即時効果。</b>']
};
var EQORDER=['kotonal','swap','mitsu','reveal','super','life','battery','radar','ice','dochi','extra','equal','himitsu'];
function eqHelpListHTML(){return EQORDER.map(function(k){var h=EQHELP[k];return '<div class="eqsec"><div class="myhandlabel">'+h[0]+'</div><div class="muted">'+h[1]+'</div></div>';}).join('');}
var GUIDE_HTML='<div class="eqtitle">あそびかた</div>'
+'<div class="sect"><div class="t">目的</div><div class="muted">みんなで協力して、すべての<b>青の配線</b>を切断するのがゴール。黄の配線も処理し、<b>赤の配線には触らない</b>こと。ライフ（❤）が0になる前にクリアを目指します。</div></div>'
+'<div class="sect"><div class="t">手番でできること</div><div class="muted">・<b>切断（2人）</b>：自分が持つ数字のコード１本と、仲間が持つ同じ数字のコード１本を狙って宣言。当たれば自分の分と合わせて2本切れる。外すと残機が１減り、宣言されたプレイヤーは指定されたコードに情報トークンを置く。<br>・<b>切断（1人）</b>：すでに同じ数字が１組（２本）切断されていて、残りの２本を持っているとき、単独でその２本を切断できる。同じ数字を４本持っているときは、一度に４本切断ができる。<br>・<b>フツーノ探知機</b>：仲間の持つコード2本に対して、数字をひとつ宣言する。その後の動きは２人での切断と同様だが、同じ数字２本のうちどちらを切るかや外したとき情報トークンをどちらに置くかは宣言されたプレイヤーが選ぶことができる。宣言したコードに赤が含まれていてもゲームは終了しない。</div></div>'
+'<div class="sect"><div class="t">情報の見方</div><div class="muted">・コードの上の<b>白いタブ</b>＝情報トークン（その位置の数字のヒント）。<br>・<b>＝ / ≠</b>＝ラベル。隣り合う2本が「同じ／違う数字」という意味。<br>・名前の横の<b>「📶応答なし」</b>＝その人は通信が切れて操作待ち。ホストが「AIに代行させる」を押すとAIが代わりに操作し<b>「📶AI代行中」</b>になる（本人が開き直せば復帰）。</div></div>'
+'<div class="sect"><div class="t">ボードの見方</div><div class="muted">・1〜12の数字が<b>緑</b>になったら、その数字は切断完了。<br>・数字の間の <b>●</b>＝赤がある、<b>▬</b>＝黄がある、<b>？</b>＝そのあたりに未確定の赤/黄。</div></div>';
function openHelp(){g('helpbody').innerHTML=GUIDE_HTML+'<div class="sect"><div class="t">装備カード（全13種）</div></div>'+eqHelpListHTML();g('helpmodal').classList.remove('hidden');}
function showEqHelp(kind){var h=EQHELP[kind];if(!h){openHelp();return;}g('helpbody').innerHTML='<div class="eqtitle">'+h[0]+'</div><div class="muted" style="line-height:1.7;font-size:14px">'+h[1]+'</div><div class="btnrow"><button class="sec" onclick="openHelp()">ルールと全カードを見る</button></div>';g('helpmodal').classList.remove('hidden');}
function closeHelp(){g('helpmodal').classList.add('hidden');}
function applyDisp(){var on=false;try{on=localStorage.getItem('bb_disp')==='tab';}catch(e){}
 document.body.classList.toggle('disp-tab',on);
 var b=document.getElementById('dispBtn');if(b)b.textContent=on?'🖥️PC表示に戻す':'📱配信用(縦長)';}
function toggleDisp(){try{localStorage.setItem('bb_disp',localStorage.getItem('bb_disp')==='tab'?'pc':'tab');}catch(e){}applyDisp();}
var EQ_ICON={reveal:'icon_memo',super:'icon_detector',dochi:'icon_goggles',extra:'icon_coffee'};function eqIconHTML(kind){return EQ_ICON[kind]?'<img class="eqic" src="assets/'+EQ_ICON[kind]+'.png" alt="">':'';}
function applySkin(){var s='ops';try{s=localStorage.getItem('bb_skin')||'ops';}catch(e){}if(['ops','pop','std'].indexOf(s)<0)s='ops';
 document.body.classList.toggle('skin-ops',s==='ops');document.body.classList.toggle('skin-pop',s==='pop');
 var b=document.getElementById('skinBtn');if(b)b.textContent='🎨配色：'+({ops:'作戦室',pop:'配信',std:'クラシック'})[s];}
function toggleSkin(){var s='ops';try{s=localStorage.getItem('bb_skin')||'ops';}catch(e){}var next={ops:'pop',pop:'std',std:'ops'}[s]||'ops';try{localStorage.setItem('bb_skin',next);}catch(e){}applySkin();}
applySkin();
/* PWA: https配信時のみService Worker登録（最新優先・オフライン時キャッシュ） */
if('serviceWorker' in navigator && location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js');}catch(e){}}

function toast(msg){var c=document.getElementById('toasts');if(!c){c=document.createElement('div');c.id='toasts';document.body.appendChild(c);}
 var t=document.createElement('div');t.className='toastmsg';t.textContent=msg;c.appendChild(t);
 requestAnimationFrame(function(){t.classList.add('show');});
 var ms=Math.min(6000,2200+String(msg).length*45);
 setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},300);},ms);}
applyDisp();
function g(id){return document.getElementById(id);}
function show(id){['lobby','waiting','game'].forEach(function(x){g(x).classList.add('hidden');});g(id).classList.remove('hidden');}
function err(m){g('err').textContent=m||'';}
function shareLink(){var url=location.origin+location.pathname+'?server='+encodeURIComponent(SRV)+'&code='+CODE;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(function(){g('sharemsg').textContent='リンクをコピーしました！仲間に送ってね';}).catch(function(){g('sharemsg').textContent=url;});}else{g('sharemsg').textContent=url;}}
function api(path,method,body){return fetch(SRV.replace(/\/$/,'')+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json();});}

function createRoom(){
  SRV=g('srv').value.trim()||SRV_DEFAULT; err('');
  api('/api/room/create','POST',{hostName:g('nm').value||'ホスト',mission:g('ms').value,pcount:parseInt(g('pc').value)})
  .then(function(r){if(r.error){err(r.error);return;}PID=r.playerId;CODE=r.code;MYSEAT=r.seat;ROOM=r.room;enterWaiting();})
  .catch(function(){err('サーバーに接続できませんでした。URLを確認してね');});
}
function spectateRoom(){
  SRV=g('srv').value.trim()||SRV_DEFAULT;var c=g('jc').value.trim().toUpperCase();if(!c){err('部屋コードを入れてね');return;}err('');
  PID='';CODE=c;MYSEAT=-1;ROOM=null;
  api('/api/room/'+c+'/state').then(function(r){if(r.error){err('部屋が見つかりません');return;}ROOM=r.room;toast('観戦モードで入室しました（全員の手札は伏せて表示）');startPoll();})
  .catch(function(){err('接続できませんでした。URL/コードを確認してね');});
}
function joinRoom(){

var polling=false;

function startPoll(){stopPoll();polling=true;tick();}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&polling)tick();});
// poll fast while waiting on others/AI, slow while it's our own move (nothing changes server-side until we act)
function nextDelay(){
  if(!ROOM||!ROOM.started)return 1500;          // lobby / waiting room
  if(!VIEW)return 1000;
  if(VIEW.over)return 3000;
  var mine=(VIEW.turn===MYSEAT)||VIEW.youPlaceInfo||VIEW.youPlaceMissInfo||VIEW.youDetPick;
  return mine?2500:700;                          // waiting on someone else => fast
}
function tick(){
  if(!polling)return;
  if(poll){clearTimeout(poll);poll=null;}   // keep a single timer chain even if tick() is called directly
  api('/api/room/'+CODE+'/state?playerId='+PID).then(function(r){
    failCount=0;g('connbar').classList.add('hidden');
    if(!r.error){ROOM=r.room;MYSEAT=r.you;REV=r.rev||0;
      if(!r.started){renderWaiting();show('waiting');renderQr();}
      else{VIEW=r.view;show('game');renderGame();}
    }
  }).catch(function(){failCount++;if(failCount>=3)g('connbar').classList.remove('hidden');}).then(function(){if(polling)poll=setTimeout(tick,failCount>=3?2000:nextDelay());});
}

  var isHost=(ROOM.hostSeat!==undefined)?(ROOM.hostSeat===MYSEAT):(ROOM.host===PID);

  if(!isYou && t.revealed && !t.cut && !t.done){
    if(t.t==='Y') return '<div class="tile back'+xc+'">'+xm+'<span class="tk yel"></span></div>';
    if(t.parity!=null) return '<div class="tile back'+xc+'">'+xm+'<span class="tk par">'+(t.parity?'奇':'偶')+'</span></div>';
    return '<div class="tile back'+xc+'">'+xm+'<span class="tk">'+t.n+'</span></div>';
  }
  var cut=(t.cut||t.done)?' cut':'';

function ownVal(i){var t=VIEW.players[MYSEAT].tiles[i];return (t&&!t.cut&&!t.done)?(t.t==='Y'?'Y':t.n):null;}
function eqTry(){if(!eqMode)return;var k=eqMode.kind,p={};
  if(k==='radar'){if(eqMode.own.length===1){var n=ownNum(eqMode.own[0]);if(n==null){toast('青コードを選んでね');eqMode.own=[];return;}p.n=n;eqSend(p);}}
  else if(k==='reveal'){if(eqMode.own.length===1){var _ri=eqMode.own[0];var _rt=VIEW.players[MYSEAT].tiles[_ri];if(!_rt||_rt.t!=='B'||_rt.cut||_rt.done||_rt.revealed){toast('公開できる青コードを選んでね');eqMode.own=[];return;}p.idx=_ri;eqSend(p);}}
  else if(k==='extra'){if(eqMode.team!=null){p.target=eqMode.team;eqSend(p);}}
  else if(k==='super'){if(eqMode.team!=null&&eqMode.own.length===1){var n2=ownNum(eqMode.own[0]);if(n2==null){toast('青コードで数字を指定してね');eqMode.own=[];return;}p.target=eqMode.team;p.n=n2;eqSend(p);}}
  else if(k==='swap'){if(eqMode.team!=null&&eqMode.own.length===1){p.target=eqMode.team;p.give=eqMode.own[0];eqSend(p);}}
  else if(k==='kotonal'||k==='equal'){if(eqMode.own.length===2){p.tiles=eqMode.own.slice().sort(function(a,b){return a-b;});eqSend(p);}}
  else if(k==='mitsu'){if(eqMode.team!=null&&eqMode.teamTiles.length===3&&eqMode.own.length===1){var n3=ownNum(eqMode.own[0]);if(n3==null){toast('青コードで数字を指定してね');eqMode.own=[];return;}p.targetPi=eqMode.team;p.idxs=eqMode.teamTiles.slice();p.decls=[n3];eqSend(p);}}
  else if(k==='dochi'){if(eqMode.team!=null&&eqMode.teamTiles.length===1&&eqMode.own.length===2){p.targetPi=eqMode.team;p.idxs=eqMode.teamTiles.slice();p.decls=[ownVal(eqMode.own[0]),ownVal(eqMode.own[1])];eqSend(p);}}
}
function eqBatteryGo(){if(!eqMode||eqMode.kind!=='battery')return;if(eqMode.teamList.length===0){toast('回復する仲間を選んでね');return;}eqSend({targets:eqMode.teamList.slice()});}
function eqSend(p){var ei=eqMode.ei;eqMode=null;act({kind:'useEquip',ei:ei,params:p});}
var modal=null;
function mates(){var a=[];VIEW.players.forEach(function(p,i){if(i!==MYSEAT)a.push(i);});return a;}
function openEquipModal(ei){var e=VIEW.equip[ei];modal={ei:ei,kind:e.kind,target:null,n:null,targets:[],give:null};renderModal();g('eqmodal').classList.remove('hidden');}
function closeModal(){modal=null;var m=g('eqmodal');if(m)m.classList.add('hidden');}
function pBtns(field,multi,filter){return mates().filter(filter||function(){return true;}).map(function(i){var on=multi?(modal.targets.indexOf(i)>=0):(modal[field]===i);return '<button class="'+(on?'on':'sec')+'" onclick="modalPick(\''+field+'\','+i+')">'+VIEW.players[i].name+'</button>';}).join('')||'<span class="muted">対象なし</span>';}
function nBtns(validFn){var h='';for(var n=1;n<=12;n++){var ok=validFn?validFn(n):true;h+='<button class="'+(modal.n===n?'on':(ok?'sec':'sec dim'))+'" '+(ok?'':'disabled')+' onclick="modalNum('+n+')">'+n+'</button>';}return h;}
function holdNum(n){return VIEW.players[MYSEAT].tiles.some(function(t){return t.t==='B'&&t.n===n&&!t.cut&&!t.done;});}
function giveBtns(){var me=VIEW.players[MYSEAT];return me.tiles.map(function(t,i){if(t.cut||t.done)return '';var lbl=String.fromCharCode(65+i)+(t.t==='B'?'('+t.n+')':(t.t==='Y'?'(黄)':'(赤)'));return '<button class="'+(modal.give===i?'on':'sec')+'" onclick="modalGive('+i+')">'+lbl+'</button>';}).join('');}
function renderModal(){if(!modal)return;var k=modal.kind,e=VIEW.equip[modal.ei],title='',body='',foot='';
  if(k==='radar'){title=e.name+'：調べる番号を選択';body='<div class="eqsec"><div class="eqchoices">'+nBtns()+'</div></div>';}
  else if(k==='extra'){title=e.name+'：再開するプレイヤーを選択';body='<div class="eqsec"><div class="eqchoices">'+pBtns('target',false)+'</div></div>';}
  else if(k==='battery'){title=e.name+'：回復する仲間（最大2人）';body='<div class="eqsec"><div class="lbl">探知機を使った仲間</div><div class="eqchoices">'+pBtns('targets',true,function(i){return !VIEW.players[i].detector;})+'</div></div>';foot='<button class="blue" onclick="modalGo()">実行</button>';}
  else if(k==='super'){title=e.name+'：対象と数字を選択';body='<div class="eqsec"><div class="lbl">対象の仲間</div><div class="eqchoices">'+pBtns('target',false)+'</div></div><div class="eqsec"><div class="lbl">宣言する数字（自分が持つ番号のみ）</div><div class="eqchoices">'+nBtns(holdNum)+'</div></div>';foot='<button class="blue" onclick="modalGo()">実行</button>';}
  else if(k==='swap'){title=e.name+'：相手と渡す自分のコード';body='<div class="eqsec"><div class="lbl">渡す相手</div><div class="eqchoices">'+pBtns('target',false)+'</div></div><div class="eqsec"><div class="lbl">渡す自分のコード</div><div class="eqchoices">'+giveBtns()+'</div></div>';foot='<button class="blue" onclick="modalGo()">実行</button>';}
  g('eqtitle').innerHTML=title;g('eqbody').innerHTML=body;g('eqfoot').innerHTML=foot+'<button class="ghost" onclick="closeModal()">取消</button>';}
function modalPick(field,i){if(field==='targets'){var q=modal.targets.indexOf(i);if(q>=0)modal.targets.splice(q,1);else if(modal.targets.length<2)modal.targets.push(i);}else{modal[field]=i;}renderModal();if(modal.kind==='extra'&&modal.target!=null)modalGo();}
function modalNum(n){modal.n=n;renderModal();if(modal.kind==='radar')modalGo();}
function modalGive(i){modal.give=i;renderModal();}
function modalGo(){if(!modal)return;var k=modal.kind,p={},ei=modal.ei;
  if(k==='radar'){if(modal.n==null)return;p.n=modal.n;}
  else if(k==='extra'){if(modal.target==null)return;p.target=modal.target;}
  else if(k==='battery'){if(modal.targets.length===0){toast('回復する仲間を選んでね');return;}p.targets=modal.targets.slice();}
  else if(k==='super'){if(modal.target==null||modal.n==null){toast('対象と数字を選んでね');return;}p.target=modal.target;p.n=modal.n;}
  else if(k==='swap'){if(modal.target==null||modal.give==null){toast('相手と渡すコードを選んでね');return;}p.target=modal.target;p.give=modal.give;}
  closeModal();act({kind:'useEquip',ei:ei,params:p});}

function placeInfoTap(i){act({kind:'placeInfo',idx:i});}
function placeMissInfoTap(i){act({kind:'placeMissInfo',idx:i});}
function detPickTap(i){act({kind:'detPick',idx:i});}
function act(move){return api('/api/room/'+CODE+'/action','POST',{playerId:PID,move:move,rev:REV}).then(function(r){if(!r.ok&&r.err)toast(r.err);selTarget=null;selOwn=null;detMode=false;detSel=[];tick();}).catch(function(){toast('送信できませんでした。通信を確認してください');tick();});}
function doCut2(){if(!selTarget||selOwn==null){toast('相手と自分の手札を1枚ずつタップしてね');return;}var t=VIEW.players[MYSEAT].tiles[selOwn];if(t.t==='Y')act({kind:'guessY',target:selTarget});else act({kind:'guess',n:t.n,target:selTarget});}
function doCut1(){var s=ownSoloNumber();if(s==null){toast('単独で切れる自分の手札を選んでね');return;}if(s==='Y')act({kind:'soloY'});else act({kind:'solo',n:s});}
function sendDetector(ownIdx){if(detSel.length!==2){toast('相手の手札を2枚タップしてね');return;}var t=VIEW.players[MYSEAT].tiles[ownIdx];if(t.t!=='B'){toast('数字（青）の手札で宣言してね');return;}act({kind:'detector',targetPi:detSel[0].pi,i1:detSel[0].i,i2:detSel[1].i,n:t.n});}
(function(){var hadQ=false;try{var q=new URLSearchParams(location.search);if(q.get('server')){g('srv').value=q.get('server');hadQ=true;}if(q.get('code')){g('jc').value=(q.get('code')||'').toUpperCase();hadQ=true;}if(q.get('name'))g('nm').value=q.get('name');}catch(e){}
  if(!hadQ){try{var sv=JSON.parse(localStorage.getItem('bb_online')||'null');if(sv&&sv.SRV&&sv.CODE&&sv.PID)tryReconnect(sv);}catch(e){}}
  try{var q2=new URLSearchParams(location.search);if(q2.get('code')){var cc=g('createCard');if(cc)cc.classList.add('hidden');}}catch(e){}})();

/* ===== 配信用演出（効果音=Web Audio合成・映像=フラッシュ/シェイク/パーティクル） ===== */
var FX={on:true,ac:null,lastBoom:0};
try{FX.on=(localStorage.getItem('bb_fx')!=='off');}catch(e){}
function fxInit(){if(!FX.ac){var AC=window.AudioContext||window.webkitAudioContext;if(AC){try{FX.ac=new AC();}catch(e){}}}if(FX.ac&&FX.ac.state==='suspended')FX.ac.resume();}
document.addEventListener('pointerdown',fxInit);
function fxBtnSync(){var b=g('fxBtn');if(b)b.textContent=FX.on?'🔊演出':'🔇演出';}
function toggleFx(){FX.on=!FX.on;try{localStorage.setItem('bb_fx',FX.on?'on':'off');}catch(e){}fxBtnSync();if(FX.on){fxInit();fxEvent('cut');}}
function fxTone(f,dur,type,vol,delay){if(!FX.ac)return;var t=FX.ac.currentTime+(delay||0);var o=FX.ac.createOscillator(),gn=FX.ac.createGain();o.type=type||'sine';o.frequency.value=f;gn.gain.setValueAtTime(vol||.2,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(gn);gn.connect(FX.ac.destination);o.start(t);o.stop(t+dur+.05);}
function fxNoise(dur,vol,fq,delay){if(!FX.ac)return;var t=FX.ac.currentTime+(delay||0);var n=Math.floor(FX.ac.sampleRate*dur);var buf=FX.ac.createBuffer(1,n,FX.ac.sampleRate);var d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var src=FX.ac.createBufferSource();src.buffer=buf;var f=FX.ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1200;var gn=FX.ac.createGain();gn.gain.value=vol||.3;src.connect(f);f.connect(gn);gn.connect(FX.ac.destination);src.start(t);}
function fxShake(big){var b=document.body;b.classList.remove('fx-shake','fx-shake-big');void b.offsetWidth;b.classList.add(big?'fx-shake-big':'fx-shake');setTimeout(function(){b.classList.remove('fx-shake','fx-shake-big');},big?700:380);}
function fxFlash(c){var f=document.createElement('div');f.className='fx-flash';f.style.background=c;document.body.appendChild(f);setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},520);}
function fxBurst(ch,n,rise){for(var i=0;i<n;i++){(function(){var p=document.createElement('div');p.className='fx-p';p.textContent=ch;p.style.left=(8+Math.random()*84)+'vw';p.style.top=(rise?(55+Math.random()*30)+'vh':'-8vh');p.style.fontSize=(16+Math.random()*22)+'px';p.style.animation='fx'+(rise?'rise':'fall')+' '+(0.9+Math.random()*1.4)+'s '+(rise?'ease-out':'ease-in')+' '+(Math.random()*0.5)+'s forwards';document.body.appendChild(p);setTimeout(function(){if(p.parentNode)p.parentNode.removeChild(p);},3200);})();}}
function fxEvent(kind){if(!FX.on)return;fxInit();var now=Date.now();
 if(kind==='boom'){if(now-FX.lastBoom<1500)return;FX.lastBoom=now;fxNoise(.7,.5,700);fxTone(55,.6,'sine',.45);fxTone(40,.8,'sine',.3,.1);fxShake(true);fxFlash('rgba(255,110,20,.45)');fxBurst('💥',12,true);fxBurst('🔥',8,true);}
 else if(kind==='cut'){fxTone(950,.06,'triangle',.22);fxTone(1500,.09,'triangle',.16,.05);fxNoise(.05,.12,5000);fxFlash('rgba(255,215,90,.16)');fxBurst('✨',6,true);}
 else if(kind==='miss'){fxTone(150,.16,'square',.18);fxTone(110,.22,'square',.14,.07);fxShake(false);fxFlash('rgba(255,60,60,.16)');}
 else if(kind==='win'){[523,659,784,1047].forEach(function(f,i){fxTone(f,.16,'sine',.2,i*.12);});fxTone(1318,.5,'sine',.18,.55);fxBurst('🎉',26,false);fxBurst('✨',16,false);fxBurst('🎊',12,false);}}
function fxClassify(s,cls){s=String(s);
 if(s.indexOf('爆発しない')<0&&s.indexOf('爆発')>=0)return 'boom';
 if(s.indexOf('解除成功')>=0)return 'win';
 if(cls==='bad'||s.indexOf('はずれ')>=0||s.indexOf('外れ')>=0)return 'miss';
 if(s.indexOf('切断')>=0)return 'cut';
 return null;}
fxBtnSync();
/* ログ差分を監視して演出を発火（初回表示・再戦直後は鳴らさない） */
var FXLOG={first:null,init:false};
function fxScanLog(arr){
 if(!arr.length){FXLOG.first=null;FXLOG.init=true;return;}
 if(!FXLOG.init){FXLOG.init=true;FXLOG.first=arr[0];return;}
 var news=[];for(var i=0;i<arr.length;i++){if(arr[i]===FXLOG.first)break;news.push(arr[i]);}
 FXLOG.first=arr[0];
 if(news.length>4){return;}  /* 大量差分=再戦などの切替とみなしスキップ */
 for(var j=news.length-1;j>=0;j--){var h=news[j];var cm=h.match(/class="(\w*)"/);var k=fxClassify(h.replace(/<[^>]+>/g,''),cm?cm[1]:'');if(k)fxEvent(k);}
}
